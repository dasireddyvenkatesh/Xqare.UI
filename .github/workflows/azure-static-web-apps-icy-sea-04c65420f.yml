name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Sandbox
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Sandbox

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Xqare/Xqare.csproj

      - name: Publish Blazor WebAssembly
        run: dotnet publish ./Xqare/Xqare.csproj -c Release -o ./publish

      - name: Diagnose published output
        shell: bash
        run: |
          echo "=== Publish directory ==="
          ls -la ./publish || true

          echo "=== Locate required files ==="
          find ./publish -type f \( \
            -name "index.html" -o \
            -name "blazor.boot.json" -o \
            -name "staticwebapp.config.json" -o \
            -name "blazor.webassembly*.js" \
          \) -print || true

          echo "=== Check expected paths ==="
          for file in \
            "./publish/wwwroot/index.html" \
            "./publish/wwwroot/_framework/blazor.boot.json" \
            "./publish/wwwroot/staticwebapp.config.json"
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo "=== Published framework files ==="
          ls -la ./publish/wwwroot/_framework/ || true

      - name: Verify published output
        shell: bash
        run: |
          set -euo pipefail
          test -f ./publish/wwwroot/index.html
          test -d ./publish/wwwroot/_framework
          echo "Published application files verified."

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SEA_04C65420F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./publish/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SEA_04C65420F }}
          action: "close"
